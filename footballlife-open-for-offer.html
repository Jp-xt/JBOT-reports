    return data.cards.filter(c=>(!term||normalize(c.name).includes(term))&&(!scarcity||c.scarcity===scarcity)&&(!type||c.type===type)).sort((a,b)=>{
      const x=a[sortKey], y=b[sortKey];
      const result=typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{sensitivity:'base'});
      return direction*result || a.id.localeCompare(b.id);
    });
  }
  function render() {
    const visible=visibleCards(), fragment=document.createDocumentFragment();
    let offer=0, valuation=0;
    data.cards.forEach(c=>{if(selected.has(c.id)){offer+=c.offer_cents;valuation+=c.valuation_cents;}});
    $('total').textContent=money(offer);$('valuation-total').textContent=money(valuation);
    document.body.dataset.currency=$('currency').value;
    document.querySelectorAll('col:nth-last-child(-n+2)').forEach(col=>col.style.width=$('currency').value==='ETH'?'160px':'120px');
    const missing=Object.keys(rates).length<4?' Some currencies are unavailable because no exchange rate was saved.':'';
    $('currency-note').textContent='Amounts in '+$('currency').value+'. Saved FX, display only; the quoted EUR prices are unchanged.'+missing;
    $('selected-count').textContent=selected.size+' / '+data.cards.length;
    $('visible-count').textContent=visible.length+' shown · '+data.cards.length+' cards';
    visible.forEach(c=>{
      const row=document.createElement('tr');row.dataset.cardId=c.id;row.classList.toggle('off',!selected.has(c.id));
      const cell=document.createElement('td'), box=document.createElement('input');box.type='checkbox';box.checked=selected.has(c.id);box.setAttribute('aria-label','Include '+c.name);
      box.addEventListener('change',()=>{box.checked?selected.add(c.id):selected.delete(c.id);persist();render();});cell.append(box);row.append(cell);
      for(const key of ['name','club','league','scarcity','type','valuation_cents','offer_cents']) {
        const td=document.createElement('td');
        if(key.endsWith('_cents')){td.textContent=money(c[key]);td.title=td.textContent;td.className='num'+(key==='offer_cents'?' offer':'');}
        else if(key==='scarcity'||key==='type'){const tag=document.createElement('span');tag.textContent=c[key];tag.className='tag '+(key==='scarcity'?c.scarcity.toLowerCase().replaceAll(' ','-'):'');td.append(tag);}
        else if(key==='name'){
          const label=document.createElement(c.card_url?'a':'span');label.textContent=c.name;
          if(c.card_url){const url=new URL(c.card_url);if(url.origin==='https://sorare.com'){label.href=url.href;label.target='_blank';label.rel='noopener noreferrer';}}
          td.className='name';td.title=c.card_slug||c.name;td.append(label);
          if(c.serial_label){const serial=document.createElement('span');serial.className='serial';serial.textContent=c.serial_label;td.append(serial);}
        }
        else {td.textContent=c[key];td.className=key;td.title=c[key];}
        row.append(td);
      }
      fragment.append(row);
    });
    if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent='No players match these filters.';tr.append(td);fragment.append(tr);}
    $('rows').replaceChildren(fragment);
    const selectedVisible=visible.filter(c=>selected.has(c.id)).length;
    $('select-visible').checked=visible.length>0&&selectedVisible===visible.length;
    $('select-visible').indeterminate=selectedVisible>0&&selectedVisible<visible.length;
    $('select-visible').disabled=!visible.length;
    document.querySelectorAll('[data-sort]').forEach(button=>{const th=button.parentElement;if(button.dataset.sort===sortKey)th.setAttribute('aria-sort',direction===1?'ascending':'descending');else th.removeAttribute('aria-sort');});
  }
  $('search').addEventListener('input',render);$('scarcity').addEventListener('change',render);$('type').addEventListener('change',render);
  $('currency').addEventListener('change',()=>{try{localStorage.setItem(storageKey+':currency',$('currency').value);}catch(_){}render();});
  $('select-visible').addEventListener('change',()=>{const checked=$('select-visible').checked;visibleCards().forEach(c=>checked?selected.add(c.id):selected.delete(c.id));persist();render();});
  document.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>{direction=sortKey===button.dataset.sort?-direction:1;sortKey=button.dataset.sort;render();}));
  $('save').addEventListener('click',()=>{
    const copy=document.documentElement.cloneNode(true), exported={...data,selected:data.cards.filter(c=>selected.has(c.id)).map(c=>c.id)};
    copy.querySelectorAll('#currency option').forEach(o=>{o.removeAttribute('selected');if(o.value===$('currency').value)o.setAttribute('selected','');});
    copy.querySelector('#report-data').textContent=JSON.stringify(exported).replaceAll('<','\\u003c').replaceAll('>','\\u003e').replaceAll('&','\\u0026');
    const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=data.manager+'-selected-report.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    setStatus('Updated report downloaded. Send this HTML file back to the buyer.');
  });
  $('load').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async()=>{
    const file=$('file').files[0];if(!file)return;
    try {
      if(file.size>10000000)throw Error('Report is too large.');
      const text=await file.text(),loaded=text.trimStart().startsWith('{')?JSON.parse(text):JSON.parse(new DOMParser().parseFromString(text,'text/html').getElementById('report-data').textContent);
      const immutable=q=>JSON.stringify(Object.fromEntries(Object.entries(q).filter(([k])=>k!=='selected')));
      if(immutable(loaded)!==immutable(data)||!validSelection(loaded.selected))throw Error('This file does not match the original quote.');
      selected=new Set(loaded.selected);persist();render();setStatus('Saved selection loaded. Quoted prices are unchanged.');
    }catch(error){setStatus('Could not load: '+error.message,true);}
    $('file').value='';
  });
  persist();render();
})();
</script>
</body>
</html>
