<script>

  document.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>{direction=sortKey===button.dataset.sort?-direction:1;sortKey=button.dataset.sort;render();}));
  $('save').addEventListener('click',()=>{
    const copy=document.documentElement.cloneNode(true), exported={...data,selected:data.cards.filter(c=>selected.has(c.id)).map(c=>c.id)};
    copy.querySelectorAll('#currency option').forEach(o=>{o.removeAttribute('selected');if(o.value===$('currency').value)o.setAttribute('selected','');});
    copy.querySelector('#report-data').textContent=JSON.stringify(exported).replaceAll('<','\\u003c').replaceAll('>','\\u003e').replaceAll('&','\\u0026');
    const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=data.manager+'-selected-report.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    setStatus('Updated report downloaded. Send this HTML file back to the buyer.');
  });
  $('load').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async()=>{
    const file=$('file').files[0];if(!file)return;
    try {
      if(file.size>10000000)throw Error('Report is too large.');
      const text=await file.text(),loaded=text.trimStart().startsWith('{')?JSON.parse(text):JSON.parse(new DOMParser().parseFromString(text,'text/html').getElementById('report-data').textContent);
      const immutable=q=>JSON.stringify(Object.fromEntries(Object.entries(q).filter(([k])=>k!=='selected')));
      if(immutable(loaded)!==immutable(data)||!validSelection(loaded.selected))throw Error('This file does not match the original quote.');
      selected=new Set(loaded.selected);persist();render();setStatus('Saved selection loaded. Quoted prices are unchanged.');
    }catch(error){setStatus('Could not load: '+error.message,true);}
    $('file').value='';
  });
  persist();render();
})();
</script>
</body>
</html>
